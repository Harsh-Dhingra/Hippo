# Every gate here blocks merge. If one fails, fix the code, not the gate
# (CLAUDE.md, Quality gates).
#
# The permission property test (10k random ACL matrices) joins this file with
# P1-CORE-3, when the filter function exists.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      # Its own named gate, run before the rest so it fails fast and reads
      # unambiguously in the checks list. It also runs inside the full suite.
      - name: role-grant leak test
        env:
          HIPPO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run pytest tests/test_roles.py -v --no-cov

      # 10k random ACL matrices against an independent oracle. Must pass on any
      # change touching retrieval, ACLs, scopes, or the filter function.
      - name: permission property test
        env:
          HIPPO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run pytest -m permission_property -v --no-cov

      # Retrieval quality as floors, and a permission red team that probes the
      # filter with the forbidden text itself. Its own gate so a leak reads
      # unambiguously in the checks list rather than as one line in a long run.
      - name: retrieval eval + permission red team
        env:
          HIPPO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run pytest -m eval -v --no-cov

      - name: pytest
        env:
          HIPPO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run pytest

  ui:
    name: ui lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: eslint
        run: npm run lint

      - name: tsc --noEmit
        run: npm run typecheck

      - name: next build
        run: npm run build

  compose-smoke:
    name: docker compose up
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: docker compose up
        run: docker compose -f deploy/compose.yaml up -d --build --wait --wait-timeout 300

      - name: healthcheck is green
        run: |
          curl -fsS http://localhost:8000/healthz | tee /dev/stderr | grep -q '"status":"ok"'

      - name: the UI is served
        run: |
          curl -fsS http://localhost:3000/login | grep -q 'Sign in'

      # The whole of ARCHITECTURE section 12, driven the way a mouse would:
      # sign in, approve a proposal, execute it, roll it back, read the trace.
      - name: the demo is drivable
        env:
          # The agent proposes and the sync worker executes, so approving a
          # proposal in the UI leaves it approved and nothing more. Without
          # this the smoke test asked whether it had executed twenty-two
          # milliseconds after approving it, which no worker could satisfy —
          # so the executed and rolled-back checks had never once run, and
          # deploy/demo/execute.py existed without being called by anything.
          HIPPO_DEMO_EXECUTOR: >-
            docker compose -f deploy/compose.yaml exec -T app
            sh -c 'python -m deploy.demo.execute "$HIPPO_DATABASE_URL"'
        run: |
          docker compose -f deploy/compose.yaml exec -T app \
            sh -c 'python -m deploy.demo.seed "$HIPPO_DATABASE_URL"'
          node ui/scripts/smoke.mjs http://localhost:3000 \
            alice@example.com hippo-demo-password

      - name: logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color

      - name: tear down
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
