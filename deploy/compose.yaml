# Two containers: the app and Postgres. That is the whole deployment.
# `docker compose -f deploy/compose.yaml up` and wait for both healthchecks.

name: hippo

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hippo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hippo}
      POSTGRES_DB: ${POSTGRES_DB:-hippo}
    volumes:
      # The entire backup story: pg_dump this volume.
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hippo} -d ${POSTGRES_DB:-hippo}"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      HIPPO_DATABASE_URL: postgresql://${POSTGRES_USER:-hippo}:${POSTGRES_PASSWORD:-hippo}@postgres:5432/${POSTGRES_DB:-hippo}
      HIPPO_LOG_LEVEL: ${HIPPO_LOG_LEVEL:-INFO}
      HIPPO_SERVICE_NAME: hippo-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HIPPO_PORT:-8000}:8000"
    healthcheck:
      # 200 only when the database is reachable and the schema is current.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=3).status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  pgdata:
