[project]
name = "hippo"
version = "0.0.0"
description = "Open-source enterprise memory: a permission-aware knowledge graph over your organization's systems."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn[standard]>=0.34",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "prometheus-client>=0.21",
    "anthropic>=0.120.0",
    "langgraph>=1.2.9",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260724",
    "mcp>=1.28.1",
]

[project.scripts]
hippo-migrate = "core.migrate:main"
# So a connector living in another repository can check itself without adopting
# this project's test layout (P3-SDK-1).
hippo-conformance = "sync.connectors.conformance:main"
# Generates a connector package that passes conformance as generated (P3-SDK-2).
hippo-new-connector = "sync.connectors.scaffold:main"
# Hippo as an MCP server, for Claude Code, Codex and anything else that speaks
# the protocol (P3-SRF-2).
hippo-mcp = "surfaces.mcp.server:main"

# The connectors that ship with Hippo, registered through the same entry-point
# group a third-party package uses. Deliberately not a private import path: if
# the built-ins took a shortcut, the discovery mechanism every contributed
# connector depends on would be the one nothing exercises (P3-SDK-1).
[project.entry-points."hippo.connectors"]
slack = "sync.connectors.builtin:SLACK"
jira = "sync.connectors.builtin:JIRA"
github = "sync.connectors.builtin:GITHUB"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "hypothesis>=6.120",
    "mypy>=1.14",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "sync", "resolver", "agent"]

[tool.hatch.build.targets.wheel.force-include]
"core/migrations" = "core/migrations"

# ---------------------------------------------------------------------------
# Quality gates. CI runs all of these; see CLAUDE.md. Do not weaken them.
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true
files = ["core", "api", "sync", "resolver", "agent", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PT", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=core",
    "--cov=api",
    "--cov=sync",
    "--cov=resolver",
    "--cov=agent",
    "--cov=evals",
    "--cov-report=term-missing",
    # Ratchet only upwards (CLAUDE.md, Quality gates).
    "--cov-fail-under=98",
]
markers = [
    "requires_db: test needs a live Postgres (skipped when HIPPO_TEST_DATABASE_URL is unset)",
    "permission_property: the 10k-case permission filter suite; its own blocking CI gate",
    "eval: the retrieval eval harness and permission red team; its own blocking CI gate",
]

[tool.coverage.run]
branch = true
omit = [
    "*/__main__.py",
    # The live-model verification. CLAUDE.md keeps live API calls out of CI, so
    # this is by definition code CI cannot execute — omitted rather than left
    # to drag the floor down and invite someone to lower it. Its safe paths
    # (the cost estimate, the missing-key branch) are still tested.
    "evals/live.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
